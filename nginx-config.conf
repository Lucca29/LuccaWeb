server {
    listen 80;
    server_name luccaweb.fr www.luccaweb.fr;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name luccaweb.fr www.luccaweb.fr;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/luccaweb.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luccaweb.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Root directory - fichiers statiques
    root /var/www/agence-lucca;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Cache pour les fichiers statiques (sauf admin)
    location ~* ^/(?!admin).*\.(css|js|png|jpg|jpeg|gif|ico|svg|webp|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Articles individuels - passer au backend Node.js (AVANT les autres règles)
    location ~ ^/article/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Bloquer script.js sous /admin
    location = /admin/script.js {
        return 404;
    }

    # Pages principales - servir directement depuis la racine
    location ~ ^/(index|contact|services|cas-etudes|qui-sommes-nous|estimer-mes-besoins|avis)\.html$ {
        try_files $uri =404;
    }

    # Blog - servir depuis la racine
    location ~ ^/blog\.html$ {
        try_files $uri =404;
    }

    # API et admin - passer au backend Node.js
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /admin {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Uploads - servir directement depuis le dossier
    location /uploads/ {
        alias /var/www/agence-lucca/backend/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Page d'accueil par défaut
    location = / {
        try_files /index.html =404;
    }

    # Tous les autres fichiers statiques
    location / {
        try_files $uri $uri/ =404;
    }

    # Sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
} 